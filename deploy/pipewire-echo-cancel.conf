# WebRTC acoustic echo cancellation for PipeWire (DSP only, no learned weights).
# Install:  mkdir -p ~/.config/pipewire/pipewire.conf.d && cp deploy/pipewire-echo-cancel.conf ~/.config/pipewire/pipewire.conf.d/60-echo-cancel.conf
#           systemctl --user restart pipewire pipewire-pulse wireplumber
# Then make the echo-cancel source/sink the defaults (the runtime and raspotify use the defaults):
#           wpctl status                                   # find the ids of echo-cancel-source / echo-cancel-sink
#           wpctl set-default <echo-cancel-source-id>
#           wpctl set-default <echo-cancel-sink-id>
context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      capture.props = { node.name = "echo-cancel-capture" }
      source.props = { node.name = "echo-cancel-source" }
      sink.props = { node.name = "echo-cancel-sink" }
      playback.props = { node.name = "echo-cancel-playback" }
    }
  }
]
